  <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Generator - Instant Sync Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.js"></script>
    <script>
        let cvReady = false;
        let cvError = false;
        
        let currentCDNIndex = 0;
        // 增加多个 CDN 备用节点，防范单点网络封锁或故障
        const cvCDNs = [
            "https://unpkg.com/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js",
            "https://docs.opencv.org/4.5.4/opencv.js"
        ];

        function onOpenCvReady() {
            console.log("OpenCV script loaded. Waiting for runtime...");
            if (typeof cv !== 'undefined') {
                if (typeof Promise !== 'undefined' && cv instanceof Promise) {
                    cv.then((target) => { 
                        window.cv = target; 
                        initCv(); 
                    }).catch(e => { console.error(e); onOpenCvError(); });
                } else if (typeof cv.then === 'function') {
                    cv.then((target) => { 
                        window.cv = target; 
                        initCv(); 
                    }).catch(e => { console.error(e); onOpenCvError(); });
                } else if (cv.getBuildInformation) {
                    initCv();
                } else {
                    cv.onRuntimeInitialized = () => { initCv(); };
                }
            } else {
                console.error("cv is undefined after script load.");
                onOpenCvError(); // 触发备选线路重试
            }
        }

        function initCv() {
            console.log("OpenCV Runtime Fully Initialized.");
            cvReady = true;
            cvError = false;
            
            // 如果加载成功，恢复因网络延迟显示的错误文本
            let label = document.getElementById('file-name-display');
            if (label && label.innerHTML.includes("OpenCV加载失败")) {
                label.innerHTML = "上传图片 (UPLOAD)";
            }

            if (typeof checkAndProcessImage === 'function') checkAndProcessImage();
        }

        function onOpenCvError() {
            // 自动重试机制：当网络失败时，按顺序切换 CDN 加载
            if (currentCDNIndex < cvCDNs.length) {
                console.warn("OpenCV load failed. Trying fallback CDN: " + cvCDNs[currentCDNIndex]);
                let script = document.createElement('script');
                script.src = cvCDNs[currentCDNIndex++];
                script.async = true;
                script.onload = onOpenCvReady;
                script.onerror = onOpenCvError;
                document.head.appendChild(script);
            } else {
                cvError = true;
                console.error("Failed to load OpenCV.js from all external CDNs.");
                updateErrorUI();
            }
        }

        function updateErrorUI() {
            let label = document.getElementById('file-name-display');
            if (label && !document.getElementById('imgInput').value) {
                label.innerHTML = "OpenCV加载失败(请检查网络/刷新)";
            }
        }
    </script>
    <!-- 默认采用速度最快、在国内节点最多的 jsdelivr 加载 OpenCV.js -->
    <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.min.js" onload="onOpenCvReady()" onerror="onOpenCvError()"></script>
    <style>
        * { 
            -webkit-box-sizing: border-box; 
            -moz-box-sizing: border-box;
            box-sizing: border-box; 
            outline: none; 
        }
        body { 
            /* 页面整体暖灰背景色 */
            background: #d5d6ce; color: #999; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-align: center; -webkit-align-items: center; -ms-flex-align: center; align-items: center; 
            -webkit-box-pack: center; -webkit-justify-content: center; -ms-flex-pack: center; justify-content: center; 
            min-height: 100vh; padding: 30px; 
            /* 保证页面背景与工具整体同步展示，先隐藏身体防止只显示背景颜色 */
            opacity: 0;
            visibility: hidden;
        }
        
        .main-container { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            /* 保证组件与 Canvas 渲染完毕后瞬间同步显示，无渐显延迟、无错位跳动 */
            visibility: hidden; 
        }
        .main-container > * + * { margin-left: 80px; } 
        
        #canvas-container { line-height: 0; background: #ffffff; } 
        
        .side-panel { 
            width: 300px; height: 800px; 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-orient: vertical; -webkit-box-direction: normal; 
            -webkit-flex-direction: column; -ms-flex-direction: column; flex-direction: column; 
        }
        .side-panel > * + * { margin-top: 15px; }

        #grid-preview-box { width: 100%; height: 180px; background: #111; position: relative; overflow: hidden; border: 1px solid #333; }
        
        .controls { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-orient: vertical; -webkit-box-direction: normal; 
            -webkit-flex-direction: column; -ms-flex-direction: column; flex-direction: column; 
            margin-top: 30px !important; 
        }
        .controls > * + * { margin-top: 10px; }

        .control-group { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-orient: vertical; -webkit-box-direction: normal; 
            -webkit-flex-direction: column; -ms-flex-direction: column; flex-direction: column; 
        }
        .control-group > * + * { margin-top: 4px; }

        .label-row, .control-group label { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-pack: justify; -webkit-justify-content: space-between; -ms-flex-pack: justify; justify-content: space-between;

        .val-display { color: #555; font-family: "SF Mono", "Roboto Mono", monospace; font-size: 11px; font-weight: bold; }

        .color-ui-wrap { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex;

        .color-ui-wrap > * + * { margin-left: 6px; }

        .color-picker-custom {

        .color-picker-custom::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-custom::-webkit-color-swatch { border: none; border-radius: 50%; }
        .color-picker-custom::-moz-color-swatch { border: none; border-radius: 50%; }

        .custom-upload-box { 
            width: 100%; height: 38px; cursor: pointer; background: #000; border: 1px solid #333; 
            font-size: 11px; 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-align: center; -webkit-align-items: center; -ms-flex-align: center; align-items: center;

        }

        select { 
            -webkit-appearance: none; -moz-appearance: none; appearance: none; 
            background: #000; border: 1px solid #333; 
            color: #aaa; font-size: 11px; width: 100%; height: 38px; 
            padding: 0 12px; border-radius: 0;
            text-align: center; text-align-last: center; 
        }
        select option { text-align: center; }

        input[type="range"] { 
            -webkit-appearance: none; -moz-appearance: none; appearance: none; 
            width: 100%; background: transparent; height: 24px; cursor: pointer; 
            margin: 2px 0; touch-action: pan-y; 
            --percent: 50%; 
        }
        
        input[type="range"]::-webkit-slider-runnable-track { 
            height: 3px; border-radius: 2px; 
            background: linear-gradient(to right, #000000 var(--percent), #ffffff var(--percent));
        }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 14px; width: 14px; 
            background: #000000; 
            border-radius: 50%; margin-top: -5.5px; 
            box-shadow: none; 
            -webkit-transition: -webkit-transform 0.15s cubic-bezier(0.2, 0, 0.2, 1); 
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1); 
            will-change: transform;
        }
        input[type="range"]:active::-webkit-slider-thumb {
            -webkit-transform: scale(1); transform: scale(1);
        }

        input[type="range"]::-moz-range-track { 
            height: 3px; border-radius: 2px; 
            background: linear-gradient(to right, #000000 var(--percent), #ffffff var(--percent));
        }
        input[type="range"]::-moz-range-thumb { 
            border: none; height: 14px; width: 14px; 
            background: #000000; border-radius: 50%; 
            box-shadow: none;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }
        input[type="range"]:active::-moz-range-thumb {
            transform: scale(1);
        }

        input[type="range"]::-ms-track { width: 100%; cursor: pointer; background: transparent; border-color: transparent; color: transparent; height: 3px; }
        input[type="range"]::-ms-fill-lower { background: #000000; border-radius: 2px; }
        input[type="range"]::-ms-fill-upper { background: #ffffff; border-radius: 2px; }
        input[type="range"]::-ms-thumb { border: none; height: 14px; width: 14px; background: #000000; border-radius: 50%; margin-top: 0; box-shadow: none; transition: transform 0.15s; }
        input[type="range"]:active::-ms-thumb { transform: scale(1); }

        button { padding: 13px; cursor: pointer; background: #333; color: #aaa; border: 1px solid #444; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; -webkit-transition: 0.2s; transition: 0.2s; }
        button:hover { background: #444; color: #fff; }
        
        .btn-group { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
            -webkit-box-orient: vertical; -webkit-box-direction: normal; 
            -webkit-flex-direction: column; -ms-flex-direction: column; flex-direction: column; 
            margin-top: auto; 
        }
        .btn-group > * + * { margin-top: 8px; }

        .save-row { 
            display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; 
        }
        .save-row > * + * { margin-left: 8px; }

        .save-row button { 
            -webkit-box-flex: 1; -webkit-flex: 1; -ms-flex: 1; flex: 1;

        .export-group button { background: #000; border-color: #222; }

<body>
<div class="main-container" id="main-app-container">
    <div id="canvas-container"></div>
    <div class="side-panel">
        <div id="grid-preview-box"></div>
        <div class="controls">
            <div class="control-group">
                <div class="label-row">
                    <div class="label-text">1. 图像源与色彩 SOURCE</div>
                    <div class="color-ui-wrap">
                        <span>FG</span><input type="color" id="dotColor" class="color-picker-custom" value="#000000">
                        <span id="toggleFillBtn" style="cursor: pointer; opacity: 0.3; display: flex; align-items: center;" title="切换底色显示">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="#555">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </span>
                        <input type="color" id="fillColorPicker" class="color-picker-custom" value="#fdf7d6">
                        <span>BG</span><input type="color" id="bgColorPicker" class="color-picker-custom" value="#ffffff">
                    </div>
                </div>
                <div class="custom-upload-box" onclick="document.getElementById('imgInput').click()">
                    <input type="file" id="imgInput" accept="image/png, image/jpeg, image/webp" style="display:none">
                    <span id="file-name-display">上传图片 (UPLOAD)</span>
                    <span id="clear-img" onclick="clearImage(event)">✕</span>
                </div>
            </div>
            <div class="control-group"><label>2. 风格模式 STYLE</label><select id="styleSelect"><option value="charcoal">复古拓印 (RETRO PRINT)</option><option value="stipple">细腻颗粒 (STIPPLE)</option></select></div>
            <div class="control-group"><label>3. 晕染范围 SPREAD <span class="val-display" id="val-viscosity">80</span></label><input type="range" id="viscosity" min="5" max="200" value="80"></div>
            <div class="control-group"><label>4. 炭粉密度 DENSITY <span class="val-display" id="val-density">80</span></label><input type="range" id="density" min="1" max="100" value="80"></div>
            <div class="control-group"><label>5. 识别阈值 THRESHOLD <span class="val-display" id="val-threshold">230</span></label><input type="range" id="threshold" min="0" max="255" value="230"></div>
            <div class="control-group"><label>6. 边缘顺滑 SMOOTH <span class="val-display" id="val-randomness">25</span></label><input type="range" id="randomness" min="1" max="150" value="25"></div>
            <div class="control-group"><label>7. 形体粗细 WEIGHT <span class="val-display" id="val-outlineWidth">0</span></label><input type="range" id="outlineWidth" min="-50" max="50" value="0"></div>
            <div class="control-group"><label>8. 图形缩放 SCALE <span class="val-display" id="val-zoom">85%</span></label><input type="range" id="zoom" min="10" max="200" value="85"></div>
        </div>
        <div class="btn-group">
            <div class="save-row"><button onclick="randomizeColors()">随机色彩</button></div>
            <div class="save-row export-group">
                <button onclick="exportFile('jpg')">JPG</button>
                <button onclick="exportFile('png')">PNG</button>
                <button onclick="exportFile('svg')">SVG</button>
            </div>
        </div>
    </div>
</div>
<script>
let sourceMat = null, basePolygons = [];
let rawSourceImg = null, displayBuffer = null, tempCanvas = null;
// 新增的高性能遮罩层缓冲
let maskDots = null, maskFill = null;
let pendingImageCanvas = null;
let viscositySlider, densitySlider, zoomSlider, thresholdSlider, randomnessSlider, outlineSlider, styleSelect, dotColorPicker, bgColorPicker, fillColorPicker;
let globalOffsetX = 0, globalOffsetY = 0;

// 分离渲染状态：OpenCV重算 / 形态重绘 / 色彩秒级合成
let needsRecalc = false;       
let needsSketchUpdate = false; 
let needsColorUpdate = false;  
let showFill = false; 

function updateSliderFill(el) {
    const min = parseFloat(el.min) || 0;
    const max = parseFloat(el.max) || 100;
    const val = parseFloat(el.value) || 0;
    const percent = ((val - min) / (max - min)) * 100;
    el.style.setProperty('--percent', percent + '%');
}

function setup() {
    pixelDensity(1);
    createCanvas(600, 800).parent('canvas-container');
    displayBuffer = createGraphics(600, 800);
    tempCanvas = createGraphics(600, 800);
    // 初始化遮罩层
    maskDots = createGraphics(600, 800);
    maskFill = createGraphics(600, 800);

    viscositySlider = select('#viscosity');
    densitySlider = select('#density');
    zoomSlider = select('#zoom');
    thresholdSlider = select('#threshold');
    randomnessSlider = select('#randomness');
    outlineSlider = select('#outlineWidth');
    dotColorPicker = select('#dotColor');
    fillColorPicker = select('#fillColorPicker');
    bgColorPicker = select('#bgColorPicker');
    styleSelect = select('#styleSelect');

    const inputs = [viscositySlider, densitySlider, zoomSlider, thresholdSlider, randomnessSlider, outlineSlider, dotColorPicker, fillColorPicker, bgColorPicker, styleSelect];
    
    inputs.forEach(input => {
        if (!input || !input.elt) return;
        if (input.elt.type === 'range') updateSliderFill(input.elt);
        
        const handleChange = (e) => {
            if (e.target.type === 'range') updateSliderFill(e.target);
            updateUIDisplay();
            
            // 核心性能优化：分离事件触发，不再重新生成颗粒形态，只做极速图层合并上色
            if (input === thresholdSlider || input === randomnessSlider || input === outlineSlider) {
                needsRecalc = true;
            } else if (input === dotColorPicker || input === fillColorPicker || input === bgColorPicker) {
                needsColorUpdate = true; // 颜色改变时，0 延迟触发秒级合成
            } else {
                needsSketchUpdate = true; // 颗粒粗细/密度改变时重新生成
            }
        };

        input.elt.addEventListener('input', handleChange);
        input.elt.addEventListener('change', handleChange);
    });
    
    document.getElementById('toggleFillBtn').addEventListener('click', function() {
        showFill = !showFill;
        this.style.opacity = showFill ? '1' : '0.3';
        needsColorUpdate = true; // 切换显示填充色瞬间合并图层
    });

    select('#imgInput').elt.addEventListener('change', handleFile);
    initGridPreview();

    if (cvReady) checkAndProcessImage();

    // 在全部元素准备就绪后，瞬间解除body与主要容器的隐藏
    document.body.style.opacity = '1';
    document.body.style.visibility = 'visible';
    document.getElementById('main-app-container').style.visibility = 'visible';
}

function updateUIDisplay() {
    select('#val-viscosity').html(viscositySlider.value());
    select('#val-density').html(densitySlider.value());
    select('#val-zoom').html(zoomSlider.value() + "%");
    select('#val-threshold').html(thresholdSlider.value());
    select('#val-randomness').html(randomnessSlider.value());
    select('#val-outlineWidth').html(outlineSlider.value());
}

function draw() {
    if (rawSourceImg) {
        if (needsRecalc || needsSketchUpdate) {
            updateSketch(needsRecalc); // 重算/重绘全部颗粒与图形
            needsRecalc = false; needsSketchUpdate = false; needsColorUpdate = false;
        } else if (needsColorUpdate) {
            updateDisplayColors(); // 高速模式：利用 GPU 合成模式极速替换图层色彩
            needsColorUpdate = false;
        }
    }
    
    background(204);
    push();
    translate(width/2 + globalOffsetX, height/2 + globalOffsetY);
    fill(bgColorPicker.value());
    noStroke();
    rectMode(CENTER);
    rect(0, 0, 600, 800);
    if (displayBuffer) {
        imageMode(CENTER);
        image(displayBuffer, 0, 0);
    }
    pop();
}

function handleFile(e) {
    if (e.target.files && e.target.files[0]) {
        let file = e.target.files[0];
        let fileName = file.name;
        let URLObj = window.URL || window.webkitURL;
        let objectURL = URLObj.createObjectURL(file);
        
        let img = new Image();
        img.onload = () => {
            try {
                let tempC = document.createElement('canvas');
                tempC.width = img.width; tempC.height = img.height;
                let ctx;
                try { ctx = tempC.getContext('2d', { willReadFrequently: true }); } 
                catch(err) { ctx = tempC.getContext('2d'); }
                if (!ctx) ctx = tempC.getContext('2d');

                ctx.fillStyle = "#FFFFFF"; 
                ctx.fillRect(0, 0, tempC.width, tempC.height);
                ctx.drawImage(img, 0, 0);
                
                pendingImageCanvas = tempC;
                
                loadImage(objectURL, (loaded) => {
                    rawSourceImg = loaded;
                    checkAndProcessImage(fileName);
                    URLObj.revokeObjectURL(objectURL);
                }, (err) => {
                    alert("图片预览读取失败。"); URLObj.revokeObjectURL(objectURL);
                });
            } catch(err) {
                alert("图片底层预处理失败。"); URLObj.revokeObjectURL(objectURL);
            }
        };
        img.onerror = () => { alert("图片解码失败，请确认格式是否正确或尝试其他图片。"); URLObj.revokeObjectURL(objectURL); };
        img.src = objectURL;
    }
}

function checkAndProcessImage(fileName) {
    if (cvError) return alert("OpenCV加载失败，无法处理图像。请检查网络后刷新页面。");
    if (!cvReady) return document.getElementById('file-name-display') && (document.getElementById('file-name-display').innerHTML = "正在等待OpenCV就绪...");
    if (!pendingImageCanvas || !rawSourceImg) return;

    try {
        if (sourceMat) { sourceMat.delete(); sourceMat = null; }
        sourceMat = cv.imread(pendingImageCanvas);
        pendingImageCanvas = null; 
        
        let el = document.getElementById('file-name-display');
        if (el) el.innerHTML = fileName ? fileName.substring(0, 10) + ".." : document.getElementById('imgInput').files[0].name.substring(0, 10) + "..";
        document.getElementById('clear-img').style.display = 'block';
        needsRecalc = true;
    } catch(err) {
        alert("OpenCV读取图像异常，请尝试更换图片。");
    }
}

function updateSketch(recalc = true) {
    if (!cvReady || !sourceMat || sourceMat.cols === 0 || sourceMat.rows === 0) return;
    
    if (recalc) {
        let gray = null, resized = null, cropped = null, binary = null, kernel = null, contours = null, hierarchy = null, approx = null, cnt = null;
        try {
            let thresh = parseInt(thresholdSlider.value()); if (thresh >= 255) thresh = 252;
            let eps = parseFloat(randomnessSlider.value());
            let dilateVal = parseInt(outlineSlider.value());
            
            gray = new cv.Mat(); cv.cvtColor(sourceMat, gray, cv.COLOR_RGBA2GRAY);
            resized = new cv.Mat(); 
            let aspect = 600 / 800; let sw = sourceMat.cols, sh = sourceMat.rows;
            let cropW = Math.round((sw/sh > aspect) ? sh * aspect : sw); let cropH = Math.round((sw/sh > aspect) ? sh : sw / aspect);
            let rx = Math.max(0, Math.floor((sw - cropW)/2)); let ry = Math.max(0, Math.floor((sh - cropH)/2));
            let rw = Math.min(sw - rx, Math.floor(cropW)); let rh = Math.min(sh - ry, Math.floor(cropH));
            
            let rect = new cv.Rect(rx, ry, rw, rh);
            cropped = gray.roi(rect);
            cv.resize(cropped, resized, new cv.Size(600, 800));
            
            binary = new cv.Mat();
            cv.threshold(resized, binary, thresh, 255, cv.THRESH_BINARY_INV);
            
            if (dilateVal !== 0) {
                let k = Math.abs(dilateVal);
                kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(k, k));
                if (dilateVal > 0) cv.dilate(binary, binary, kernel); else cv.erode(binary, binary, kernel);
            }
            
            contours = new cv.MatVector(); hierarchy = new cv.Mat();
            cv.findContours(binary, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            let nextPolygons = []; approx = new cv.Mat();
            for (let i = 0; i < contours.size(); ++i) {
                cnt = contours.get(i); 
                if (cv.contourArea(cnt) < 40) { cnt.delete(); cnt = null; continue; }
                cv.approxPolyDP(cnt, approx, eps, true);
                let pts = [];
                for (let j = 0; j < approx.rows; ++j) pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
                nextPolygons.push(pts); 
                cnt.delete(); cnt = null;
            }
            basePolygons = nextPolygons;
        } finally {
            if (gray) gray.delete(); if (resized) resized.delete(); if (cropped) cropped.delete(); 
            if (binary) binary.delete(); if (kernel) kernel.delete(); if (contours) contours.delete();
            if (hierarchy) hierarchy.delete(); if (approx) approx.delete(); if (cnt) cnt.delete();
        }
    }
    
    // 生成纯色高性能遮罩，供极速拾色器复用
    renderCore(maskDots, 1, true, 'maskDots');
    renderCore(maskFill, 1, true, 'maskFill');
    
    // 生成完成后即可高速上色
    updateDisplayColors();
}

// 高性能极速色彩合成，耗时<1ms，实现拾色器 0 延迟绝对顺滑
function updateDisplayColors() {
    if (!maskDots || !maskFill) return;
    displayBuffer.clear();
    let ctx = displayBuffer.drawingContext;

    // 1. 合成底色层
    if (showFill) {
        tempCanvas.clear();
        let tCtx = tempCanvas.drawingContext;
        tCtx.globalCompositeOperation = 'copy';
        tCtx.drawImage(maskFill.canvas, 0, 0);
        tCtx.globalCompositeOperation = 'source-in'; // 核心提速魔法：用色块填充遮罩
        tCtx.fillStyle = fillColorPicker.value();
        tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(tempCanvas.canvas, 0, 0);
    }

    // 2. 合成颗粒层
    tempCanvas.clear();
    let tCtx = tempCanvas.drawingContext;
    tCtx.globalCompositeOperation = 'copy';
    tCtx.drawImage(maskDots.canvas, 0, 0);
    tCtx.globalCompositeOperation = 'source-in';
    tCtx.fillStyle = dotColorPicker.value();
    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(tempCanvas.canvas, 0, 0);
}

// 核心渲染器，加入 mode 参数适配遮罩极速生成机制与高清原样导出机制
function renderCore(target, scale, isPNG, mode = 'normal') {
    if (isPNG || mode !== 'normal') target.clear(); else target.background(bgColorPicker.value());
    randomSeed(100);
    let ctx = target.drawingContext;
    let bSize = parseFloat(viscositySlider.value()) * scale;
    let dens = parseInt(densitySlider.value());
    let gScale = parseFloat(zoomSlider.value()) / 100;
    
    let rgb = color(dotColorPicker.value());
    let r = red(rgb), g = green(rgb), b = blue(rgb);
    let fillCol = fillColorPicker.value();

    if (mode === 'maskDots') { r = 255; g = 255; b = 255; }
    if (mode === 'maskFill') { fillCol = "#FFFFFF"; }

    target.push();
    target.translate(target.width/2, target.height/2);
    target.scale(gScale);
    target.translate(-target.width/2, -target.height/2);

    basePolygons.forEach(poly => {
        if (poly.length < 3) return;
        const pts = poly.map(p => ({ x: p.x * scale, y: p.y * scale }));
        ctx.save(); 
        ctx.beginPath();
        ctx.moveTo((pts[pts.length-1].x + pts[0].x)/2, (pts[pts.length-1].y + pts[0].y)/2);
        for (let i = 0; i < pts.length; i++) {
            let p1 = pts[i], p2 = pts[(i+1)%pts.length];
            ctx.quadraticCurveTo(p1.x, p1.y, (p1.x+p2.x)/2, (p1.y+p2.y)/2);
        }
        ctx.closePath(); 
        
        // 渲染填充
        if ((showFill || mode === 'maskFill') && mode !== 'maskDots') {
            ctx.fillStyle = fillCol;
            ctx.fill();
        }
        
        if (mode === 'maskFill') {
            ctx.restore();
            return; // 仅需要遮罩时跳过巨量颗粒绘制
        }
        
        ctx.clip(); 

        const drawGrainLayer = (a, spread, countFactor) => {
            ctx.fillStyle = `rgba(${r},${g},${b},${a})`; 
            ctx.beginPath();
            let pCount = Math.max(1, Math.ceil(dens * 0.7 * countFactor)); 
            let stepBase = 5.0; 
            for (let i = 0; i < pts.length; i++) {
                let p1 = pts[i], p2 = pts[(i+1)%pts.length], p0 = pts[i === 0 ? pts.length - 1 : i - 1];
                let sx = (p0.x + p1.x) / 2, sy = (p0.y + p1.y) / 2, ex = (p1.x + p2.x) / 2, ey = (p1.y + p2.y) / 2;
                let dx = ex - sx; let dy = ey - sy; let dist = Math.sqrt(dx * dx + dy * dy);
                let step = Math.max(0.15, stepBase / dist); 
                for (let t = 0; t < 1; t += step) {
                    let t_inv = 1 - t, cx = t_inv * t_inv * sx + 2 * t_inv * t * p1.x + t * t * ex, cy = t_inv * t_inv * sy + 2 * t_inv * t * p1.y + t * t * ey;
                    for (let j = 0; j < pCount; j++) {
                        let rr = Math.pow(random(), 1.4) * bSize * spread;
                        let aa = random() * 6.28;
                        let vx = cx + Math.cos(aa) * rr, vy = cy + Math.sin(aa) * rr;
                        let s = (random() * 2.0 + 0.6) * scale;
                        ctx.moveTo(vx, vy); ctx.arc(vx, vy, s/2, 0, 6.28); 
                    }
                }
            }
            ctx.fill();
        };

        let steps = 8;
        for (let i = 0; i < steps; i++) {
            let t = i / (steps - 1 || 1);
            let layerAlpha = 0.95 * Math.pow(1 - t, 1.2);  
            let layerSpread = 0.3 + 1.2 * t;               
            let countF = 1.5 * (1 - t * 0.4) * (3 / steps);
            drawGrainLayer(layerAlpha, layerSpread, countF);
        }
        ctx.restore();
    });
    target.pop();
}

// HSL 转 HEX 的转换算法
function HSLToHex(h, s, l) {
    s /= 100; l /= 100;
    let a = s * Math.min(l, 1 - l);
    let f = (n, k = (n + h / 30) % 12) => l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    let toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

function randomizeColors() {
    // 1. 图形色(FG)永远保持黑色不变，确保视觉主体性
    let fgHex = "#000000";
    
    // 2. 背景色(BG): 全色相随机，色彩变化极其丰富
    let bgHue = Math.floor(Math.random() * 360); 
    // 饱和度 30-70%，保留充足的色彩感
    let bgSat = 30 + Math.floor(Math.random() * 40);
    // 明度 60-90%，保持中高明度，保证黑色图形绝不融进背景，印上去永远清晰
    let bgLight = 60 + Math.floor(Math.random() * 30);
    
    // 3. 图形底色(FILL): 高级莫兰迪色系，并与背景色形成强烈对撞
    // 色相在背景色的对立面（相差 135 到 225 度之间）
    let fillHue = (bgHue + 135 + Math.floor(Math.random() * 90)) % 360;
    // 莫兰迪色的精髓：低饱和度 (15-35%)，自带高级灰质感
    let fillSat = 15 + Math.floor(Math.random() * 20); 
    // 中等偏高的柔和明度 (50-75%)
    let fillLight = 50 + Math.floor(Math.random() * 25);

    // 将计算好的颜色应用到选择器和画布中
    dotColorPicker.value(fgHex);
    fillColorPicker.value(HSLToHex(fillHue, fillSat, fillLight));
    bgColorPicker.value(HSLToHex(bgHue, bgSat, bgLight));
    
    needsColorUpdate = true; // 色彩改变瞬间秒级刷新
}

function exportFile(fmt) {
    if (!rawSourceImg || basePolygons.length === 0) return;
    if (fmt === 'svg') { exportSVG(); return; }
    
    const exportW = 3508, exportH = 4677;
    const exportScale = exportW / 600;
    let hiRes = createGraphics(exportW, exportH);
    renderCore(hiRes, exportScale, fmt === 'png', 'normal');
    save(hiRes, "Pattern_" + Date.now() + "." + fmt);
    hiRes.remove();
}

function exportSVG() {
    console.log("Generating extremely precise & fast vector SVG...");
    const exportW = 3508, exportH = 4677;
    const scale = exportW / 600;
    
    let bSize = parseFloat(viscositySlider.value()) * scale;
    let dens = parseInt(densitySlider.value());
    let gScale = parseFloat(zoomSlider.value()) / 100;
    
    let dotHex = dotColorPicker.value();
    let bgHex = bgColorPicker.value();
    let fillHex = fillColorPicker.value();
    
    let svgStr = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    svgStr += `<svg xmlns="http://www.w3.org/2000/svg" width="${exportW}" height="${exportH}" viewBox="0 0 ${exportW} ${exportH}">\n`;
    svgStr += `<rect width="100%" height="100%" fill="${bgHex}" />\n`;
    svgStr += `<g transform="translate(${exportW/2}, ${exportH/2}) scale(${gScale}) translate(${-exportW/2}, ${-exportH/2})">\n`;
    
    let bodyStr = ``;
    
    // 核心改进：引入射线法(Ray-Casting)，从纯数学层面计算判断圆点是否在图形范围内。
    // 这将彻底取代在 SVG 中使用 <clipPath> (剪贴路径)，让导出文件变为 100% 绝对纯净的可编辑矢量。
    const isPointInside = (x, y, polygon) => {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            let xi = polygon[i].x, yi = polygon[i].y;
            let xj = polygon[j].x, yj = polygon[j].y;
            let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    };

    basePolygons.forEach((poly, polyIdx) => {
        if (poly.length < 3) return;
        const pts = poly.map(p => ({ x: p.x * scale, y: p.y * scale }));
        
        let pathData = `M ${(pts[pts.length-1].x + pts[0].x)/2} ${(pts[pts.length-1].y + pts[0].y)/2} `;
        
        // --- 修改核心：为精准贴合平滑边缘过滤颗粒，提前构建二次贝塞尔曲线的细分平滑多边形轮廓 ---
        let smoothPts = [];
        
        for (let i = 0; i < pts.length; i++) {
            let p1 = pts[i], p2 = pts[(i+1)%pts.length], p0 = pts[i === 0 ? pts.length - 1 : i - 1];
            
            let startX = (p0.x + p1.x)/2, startY = (p0.y + p1.y)/2;
            let cx = p1.x, cy = p1.y;
            let endX = (p1.x+p2.x)/2, endY = (p1.y+p2.y)/2;
            
            // 将每段平滑贝塞尔曲线细分成 10 份的高精度轮廓（完美解决颗粒过滤时出现棱角几何边问题）
            for (let t = 0; t < 1; t += 0.1) {
                let u = 1 - t;
                smoothPts.push({
                    x: u * u * startX + 2 * u * t * cx + t * t * endX,
                    y: u * u * startY + 2 * u * t * cy + t * t * endY
                });
            }
            
            pathData += `Q ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} ${endX.toFixed(2)} ${endY.toFixed(2)} `;
        }
        pathData += "Z";
        
        if (showFill) {
            bodyStr += `<path d="${pathData}" fill="${fillHex}" />\n`;
        }
        
        const addGrainSVG = (a, spread, countFactor) => {
            let pCount = Math.max(1, Math.ceil(dens * 0.7 * countFactor * 1.0)); 
            let stepBase = 5.0 * 1.0; 
            
            let circleBuffer = [];
            for (let i = 0; i < pts.length; i++) {
                let p1 = pts[i], p2 = pts[(i+1)%pts.length], p0 = pts[i === 0 ? pts.length - 1 : i - 1];
                let sx = (p0.x + p1.x) / 2, sy = (p0.y + p1.y) / 2, ex = (p1.x + p2.x) / 2, ey = (p1.y + p2.y) / 2;
                
                let dx = ex - sx; let dy = ey - sy;
                let dist = Math.sqrt(dx * dx + dy * dy);

                let step = Math.max(0.15, stepBase / dist); 
                for (let t = 0; t < 1; t += step) {
                    let t_inv = 1 - t, cx = t_inv * t_inv * sx + 2 * t_inv * t * p1.x + t * t * ex, cy = t_inv * t_inv * sy + 2 * t_inv * t * p1.y + t * t * ey;
                    for (let j = 0; j < pCount; j++) {
                        let rr = Math.pow(random(), 1.4) * bSize * spread;
                        let aa = random() * 6.28;
                        let vx = cx + Math.cos(aa) * rr, vy = cy + Math.sin(aa) * rr;
                        
                        // 核心滤过逻辑：如果不包含在“平滑贝塞尔”轮廓内，直接扔掉，坚决不写入 SVG！
                        if (!isPointInside(vx, vy, smoothPts)) continue;

                        let s = (random() * 2.0 + 0.6) * scale;
                        
                        // 使用 M...a... 指令将圆点无缝编入原生复合路径 (Compound Path)
                        let rVal = s / 2;
                        circleBuffer.push(`M${(vx - rVal).toFixed(1)},${vy.toFixed(1)}a${rVal.toFixed(1)},${rVal.toFixed(1)} 0 1,0 ${s.toFixed(1)},0a${rVal.toFixed(1)},${rVal.toFixed(1)} 0 1,0 -${s.toFixed(1)},0`);
                    }
                }
            }
            
            if (circleBuffer.length > 0) {
                // 每 10000 颗粒打成一个独立的 Compound Path，AI 可直接单选并随意调色。
                let chunkSize = 10000;
                for (let k = 0; k < circleBuffer.length; k += chunkSize) {
                    let chunk = circleBuffer.slice(k, k + chunkSize).join("");
                    bodyStr += `<path fill="${dotHex}" opacity="${a.toFixed(3)}" d="${chunk}" />\n`;
                }
            }
        };
        
        let steps = 8;
        for (let i = 0; i < steps; i++) {
            let t = i / (steps - 1 || 1);
            let layerAlpha = 0.95 * Math.pow(1 - t, 1.2);
            let layerSpread = 0.3 + 1.2 * t; 
            let countF = 1.5 * (1 - t * 0.4) * (3 / steps);
            addGrainSVG(layerAlpha, layerSpread, countF);
        }
    });
    
    svgStr += bodyStr + `</g>\n</svg>`;
    
    let blob;
    try {
        blob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
    } catch (e) {
        window.BlobBuilder = window.BlobBuilder || window.WebKitBlobBuilder || window.MozBlobBuilder || window.MSBlobBuilder;
        if (window.BlobBuilder) {
            let bb = new BlobBuilder(); bb.append(svgStr); blob = bb.getBlob("image/svg+xml;charset=utf-8");
        }
    }

    let URLObj = window.URL || window.webkitURL || window;
    let url = URLObj.createObjectURL(blob);
    let a = document.createElement("a");
    
    if (typeof a.download !== 'undefined') {
        a.href = url; a.download = "Pattern_" + Date.now() + ".svg";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else {
        window.open(url, "_blank");
    }
    
    setTimeout(() => { URLObj.revokeObjectURL(url); }, 1500);
    console.log("SVG generation completed.");
}

function clearImage(e) {
    e.stopPropagation(); document.getElementById('imgInput').value = "";
    if(sourceMat) { sourceMat.delete(); sourceMat = null; }
    rawSourceImg = null; basePolygons = [];
    pendingImageCanvas = null;
    displayBuffer.background(bgColorPicker.value()); 
    tempCanvas.clear(); maskDots.clear(); maskFill.clear();
    select('#file-name-display').html("上传图片 (UPLOAD)");
    document.getElementById('clear-img').style.display = 'none';
    needsColorUpdate = true; 
}

function initGridPreview() {
    new p5((p) => {
        let drg = false;
        p.setup = () => p.createCanvas(300, 180).parent('grid-preview-box');
        p.mousePressed = () => { if (p.mouseX>0 && p.mouseX<300 && p.mouseY>0 && p.mouseY<180) drg = true; };
        p.mouseReleased = () => drg = false;
        p.draw = () => {
            if (drg) { globalOffsetX += (p.mouseX - p.pmouseX)*2; globalOffsetY += (p.mouseY - p.pmouseY)*4.4; needsColorUpdate = true; }
            p.background("#111");
            if (rawSourceImg) {
                p.push(); p.imageMode(p.CENTER);
                let s = (180 / rawSourceImg.height) * 0.8;
                p.translate(150 + (globalOffsetX * 0.5), 90 + (globalOffsetY * 0.225));
                p.image(rawSourceImg, 0, 0, rawSourceImg.width * s, rawSourceImg.height * s);
                p.pop();
            }
            p.noStroke(); p.fill("#555"); p.textSize(10); p.textAlign(p.CENTER, p.CENTER);
            if(!rawSourceImg) p.text("IMAGE PREVIEW", p.width/2, p.height/2);
        };
    });
}
